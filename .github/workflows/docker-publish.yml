name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Validate Nix flake
        run: nix flake check --all-systems --no-build

      - name: Install JavaScript dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Check embedded reference data
        run: nix develop -c cargo xtask check-reference-data

      - name: Run native semantic tests
        run: nix develop -c cargo test --workspace --exclude cloudflare-worker

      - name: Check Rust formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Check fuzz-target formatting
        run: nix develop -c cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Lint native Rust targets
        run: nix develop -c cargo clippy --workspace --exclude cloudflare-worker --all-targets -- -D warnings

      - name: Compile validator fuzz target
        run: nix develop -c cargo check --manifest-path fuzz/Cargo.toml --bin validators --locked

      - name: Build native Rust targets
        run: nix develop -c cargo build --workspace --exclude cloudflare-worker

      - name: Build browser WebAssembly
        run: nix develop -c make wasm-release

      - name: Check Cloudflare Worker WebAssembly
        run: nix develop -c cargo check -p cloudflare-worker --target wasm32-unknown-unknown

      - name: Build Cloudflare Worker WebAssembly
        run: nix develop -c make worker

      - name: Validate Wrangler deployment bundle
        run: nix develop -c pnpm exec wrangler deploy --dry-run

  build-and-push:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write  # for provenance attestation
      id-token: write      # for keyless OIDC signing

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # immutable tag: full commit SHA
            type=sha,prefix=sha-,format=long
            # convenience tag on main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA layer cache — speeds up repeated builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generates a signed SLSA provenance attestation and attaches it to
      # the image in the registry. Ties the image digest to this exact
      # repo, commit, and workflow run — verifiable by anyone.
      # Only runs on public repositories (required by GitHub's attestation API).
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
