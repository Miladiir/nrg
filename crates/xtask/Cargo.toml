[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
encoding_rs = "0.8"
hex = "0.4"
id-core = { path = "../id-core" }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
