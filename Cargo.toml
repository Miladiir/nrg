[workspace]
members = [
    "crates/cloudflare-worker",
    "crates/id-core",
    "crates/nrg-api",
    "crates/server",
    "crates/xtask",
]
resolver = "2"

# Full DWARF debug info in the .wasm binary so Firefox can show Rust source
# in the debugger. wasm-pack --dev skips wasm-opt, so these sections survive.
[profile.dev]
opt-level = 0
debug = 2

# Keep the Cloudflare Worker small and fast to instantiate. These settings also
# produce a compact native server binary for the container deployment.
[profile.release]
lto = true
strip = true
codegen-units = 1
